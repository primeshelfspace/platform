# nginx server block for the bare domain (sugrpay.com): sends everything to the
# web app at https://www.sugrpay.com (hosted on AWS Amplify), keeping the path,
# so old links like sugrpay.com/pay/i/… still land on the right page.
#
# Why here and not in Amplify: the domain's DNS is at GoDaddy, which cannot
# point a bare domain at Amplify (that needs an ANAME/ALIAS record). So the
# bare domain's A record points at this server instead.
#
#   sudo cp ~/platform/deploy/nginx/root-redirect.conf /etc/nginx/sites-available/sugrpay-root.conf
#   sudo ln -sf /etc/nginx/sites-available/sugrpay-root.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   bash ~/platform/deploy/production/request-certificate.sh sugrpay.com
#
# certbot then adds the HTTPS listener to this file.

server {
    listen 80;
    listen [::]:80;
    server_name sugrpay.com;

    # HTTPS only from the first visit on (browsers ignore this over plain HTTP;
    # it takes effect on the HTTPS listener certbot adds to this block).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location / {
        return 301 https://www.sugrpay.com$request_uri;
    }
}
