# Compression for the API responses: JSON, and the Swagger page's script,
# styles and OpenAPI document (/docs). Ubuntu's nginx.conf turns gzip on but
# only for text/html, so without this the 1.4 MB Swagger script and every
# JSON response go out uncompressed.
#
#   sudo cp deploy/nginx/gzip.conf /etc/nginx/conf.d/gzip.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# http-level (conf.d), so it covers every server block. PDFs and images are
# already compressed and are left alone.
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    application/json
    application/javascript
    text/javascript
    text/css
    text/plain
    image/svg+xml;
