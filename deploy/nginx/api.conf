# nginx for the three backend APIs, one address each, plus api.sugrpay.com as
# a front door that passes every path to the API that owns it. Install as in
# docs/operations/production.md, then run certbot for each name, which adds the
# HTTPS listeners, certificates and HTTP -> HTTPS redirects.
#
#   platform-api.sugrpay.com -> platform API  127.0.0.1:4001
#   sugrpay-api.sugrpay.com  -> Sugrpay API   127.0.0.1:4002
#   hq-api.sugrpay.com       -> HQ API        127.0.0.1:4003 (skeleton)
#   api.sugrpay.com          -> by path, same rule as apiServiceFor in
#                               packages/platform-contracts/src/api-routing.ts
#
# /internal/ is how the APIs call each other on this machine (127.0.0.1); it
# is refused here on every public name.

upstream platform_api { server 127.0.0.1:4001; keepalive 16; }
upstream sugrpay_api  { server 127.0.0.1:4002; keepalive 16; }
upstream hq_api       { server 127.0.0.1:4003; keepalive 4; }

# Zoho Books signs no request (see zoho-webhook-token.ts); the only
# credential is a token the webhook URL carries as ?token=. The combined log
# format's default $request/$request_uri include the full query string, which
# would put that long-lived token in plaintext in every access log line.
# $uri is the path only — no query string — so it never appears here.
log_format zoho_webhook '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                         '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

# Shared proxy settings (kept inline per location below):
#   proxy_http_version 1.1; proxy_set_header Connection "";
#   Host, X-Real-IP, X-Forwarded-For, X-Forwarded-Proto — the APIs run with
#   `trust proxy 1`: this hop's X-Forwarded-For is the client address used for
#   rate limits, login lockout and the audit log.

server {
    listen 80;
    listen [::]:80;
    server_name platform-api.sugrpay.com;
    # Logos are up to 5 MB.
    client_max_body_size 6m;
    location /internal/ { return 404; }
    location / {
        proxy_pass http://platform_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name sugrpay-api.sugrpay.com;
    # Check uploads carry a front and a back image of up to 10 MB each.
    client_max_body_size 25m;
    location /internal/ { return 404; }
    # Carved out ahead of the catch-all below purely for its own access_log —
    # see the zoho_webhook log_format's own comment. Same upstream and
    # headers as location / otherwise.
    location ~ ^/webhooks/zoho(/|$) {
        access_log /var/log/nginx/zoho-webhook-access.log zoho_webhook;
        proxy_pass http://sugrpay_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://sugrpay_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Invoice PDFs are rendered with headless Chrome on request.
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name hq-api.sugrpay.com;
    location /internal/ { return 404; }
    location / {
        proxy_pass http://hq_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# The front door. Existing links and settings keep working: the Zoho redirect
# URI (/integrations/zoho/callback), the Stripe webhook (/public/webhooks/stripe)
# and anything else already pointing at api.sugrpay.com.
server {
    listen 80;
    listen [::]:80;
    server_name api.sugrpay.com;
    client_max_body_size 25m;

    location /internal/ { return 404; }

    # Carved out ahead of the combined regex below purely for its own
    # access_log — see the zoho_webhook log_format's own comment. Same
    # upstream and headers as that block otherwise, so it must stay in sync.
    location ~ ^/webhooks/zoho(/|$) {
        access_log /var/log/nginx/zoho-webhook-access.log zoho_webhook;
        proxy_pass http://sugrpay_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    # Sugrpay's paths (apiServiceFor); everything else is the platform's.
    # webhooks/zoho is handled by its own location above, not here.
    location ~ ^/(dashboard|public|integrations/zoho|health/queues)(/|$) {
        proxy_pass http://sugrpay_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location ~ ^/brands/[^/]+/(checks|customers|invoices|payments|settings|integrations/zoho)(/|$) {
        proxy_pass http://sugrpay_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location / {
        proxy_pass http://platform_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
