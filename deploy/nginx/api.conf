# nginx server block for the API. Install it as described in
# docs/guides/deploy-ec2.md, then run certbot, which adds the HTTPS listener,
# the certificate and the HTTP -> HTTPS redirect to this file.
#
# The web apps' server blocks live in sugrpay-frontend/deploy/nginx/web.conf.

server {
    listen 80;
    listen [::]:80;
    server_name api.primeshelfspace.com;

    # Check uploads carry a front and a back image of up to 10 MB each
    # (MAX_CHECK_IMAGE_BYTES); logos are up to 5 MB.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        # The API runs with `trust proxy 1`: this hop's X-Forwarded-For is the
        # client address used for login lockout and the audit log.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Invoice PDFs are rendered with headless Chrome on request; the first
        # one after a restart also starts the browser.
        proxy_read_timeout 60s;
    }
}
