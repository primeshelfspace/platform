packages:
  - 'apps/*'
  - 'packages/*'
  - 'e2e'

# One node_modules, at the repository root: every app and package resolves
# its libraries from there (no per-workspace node_modules folders).
#
# A flat tree lets code import a library its own package.json never declared.
# The payment app's dependency list is a PCI scope question, so
# `pnpm check:deps` (scripts/check-deps.mjs) fails if any app or package
# imports something it does not declare.
nodeLinker: hoisted

# Nest and Prisma rely on peer resolution that strict peer checks reject.
strictPeerDependencies: false
autoInstallPeers: true

# Run pre/post lifecycle scripts declared in package.json files.
enablePrePostScripts: true

# Build scripts are opt-in (pnpm >= 10). Each entry is a deliberate decision:
# a package that runs code at install time is a supply-chain surface.
allowBuilds:
  esbuild: true # vitest and next bundling
  '@prisma/client': true # generates the typed client
  prisma: true # engine download
  '@prisma/engines': true
  '@nestjs/core': true # nestjs post-install banner
  sharp: true # next/image optimisation
  '@tailwindcss/oxide': true
  bcrypt: true
  unrs-resolver: true
  # Optional native accelerator for msgpackr (BullMQ). The pure-JS path is fast
  # enough at this load and avoids a native build in every environment.
  msgpackr-extract: false
  puppeteer: true # downloads bundled Chromium at install time — needed to render invoice PDFs server-side
