# Local dependency services (TER-001 §3.1).
#
# Docker is the documented path. If Docker is unavailable on a workstation,
# `pnpm services:up` falls back to Homebrew-managed postgres/redis and an
# in-repo SMTP sink — see scripts/services.mjs.

services:
  postgres:
    image: postgres:16-alpine
    container_name: sugrpay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sugrpay
      POSTGRES_PASSWORD: sugrpay
      POSTGRES_DB: sugrpay
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sugrpay -d sugrpay']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sugrpay-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Captures all outbound mail; browsable at http://localhost:1080
  mailcatcher:
    image: sj26/mailcatcher:latest
    container_name: sugrpay-mailcatcher
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '1080:1080'

  # S3-compatible object storage for invoice PDFs and check images.
  minio:
    image: minio/minio:latest
    container_name: sugrpay-minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: sugrpay
      MINIO_ROOT_PASSWORD: sugrpay-local
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
  minio-data:
