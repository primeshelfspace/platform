name: CI

# Pipeline stages per TER-001 §5.1. Stages that have no code to run yet are
# present and skipped explicitly rather than omitted, so the gap is visible.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  static:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Everything downstream imports its types.
      - run: pnpm --filter @fenwick/shared build

      - run: pnpm --filter @fenwick/api db:generate

      - name: Type check
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fenwick/shared build

      # NFR-TST-001: 90% coverage on the calculation and state machine modules,
      # enforced by the thresholds in vitest.config.ts.
      - name: Money and domain tests with coverage gate
        run: pnpm --filter @fenwick/shared exec vitest run --coverage

  integration:
    name: Integration (PostgreSQL, RLS active)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fenwick
          POSTGRES_PASSWORD: fenwick
          POSTGRES_DB: fenwick
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fenwick"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      APP_ENV: ci
      NODE_ENV: test
      DATABASE_URL: postgresql://fenwick_app:fenwick_app@localhost:5432/fenwick?schema=public
      DIRECT_DATABASE_URL: postgresql://fenwick:fenwick@localhost:5432/fenwick?schema=public
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-session-secret-not-used-outside-ci-0000
      CREDENTIAL_ENCRYPTION_KEY: Y2ktb25seS0zMi1ieXRlLWtleS1mb3ItdGVzdHMhIQ==
      MAIL_DRIVER: console
      STORAGE_DRIVER: local
      PAYMENT_GATEWAY_DRIVER: fake
      ACCOUNTING_DRIVER: fake

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fenwick/shared build

      # migrate deploy creates the non-owner role and installs the RLS policies.
      - name: Migrate and seed
        run: |
          pnpm --filter @fenwick/api db:migrate
          pnpm --filter @fenwick/api db:seed

      # These run as fenwick_app, so the policies are genuinely in force.
      - name: Tenant isolation tests
        run: pnpm --filter @fenwick/api test

  authorisation-matrix:
    name: Authorisation matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fenwick/shared build

      # NFR-SEC-012 requires the full cross product of role × endpoint × brand
      # assignment. The matrix and its unit tests exist; the endpoint half is
      # generated once there are protected endpoints to enumerate.
      - name: Permission matrix tests
        run: pnpm --filter @fenwick/shared exec vitest run src/domain/roles.test.ts

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fenwick/shared build
      - run: pnpm --filter @fenwick/api db:generate
      - run: pnpm --filter @fenwick/api build
      - run: pnpm --filter @fenwick/admin build
      - run: pnpm --filter @fenwick/payment build

      # NFR-PRF-013: the payment application's first load is budgeted at 400 KB
      # compressed. Failing the build is the only version of this budget that
      # survives contact with a deadline.
      - name: Payment bundle budget
        run: node scripts/check-bundle-budget.mjs
