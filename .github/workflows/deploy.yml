name: Deploy to staging

# Runs only after CI has actually passed on main — never in parallel with it,
# and never on a PR. workflow_run (not push) is what enforces that ordering.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

# Least-privilege token for the fetch auth below — this is the only thing
# GITHUB_TOKEN is used for in this workflow.
permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to staging EC2
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ubuntu
          key: ${{ secrets.STAGING_SSH_KEY }}
          command_timeout: 15m
          envs: DEPLOY_TOKEN
          script: |
            set -e
            cd ~/Multi-Brand-Invoicing

            # The box's own `origin` remote has no stored git credentials —
            # every deploy was failing here with "could not read Username for
            # 'https://github.com'" (repo is private, anonymous HTTPS 401s).
            # Rather than provisioning a long-lived credential or deploy key
            # on the box, authenticate just this one fetch with the run's own
            # ephemeral GITHUB_TOKEN, passed in via DEPLOY_TOKEN above. It's
            # sent as an extraheader (same mechanism actions/checkout uses),
            # never embedded in the URL or argv, and expires with the job.
            # -w0 matters: plain `base64` line-wraps at 76 cols, which
            # embeds a newline mid-header — curl then rejects the header
            # outright ("A libcurl function was given a bad argument").
            git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$DEPLOY_TOKEN" | base64 -w0)" \
              fetch https://github.com/primeshelfspace/Multi-Brand-Invoicing.git main

            # Discards nothing that matters: .env and any other untracked file
            # (this workflow file's own runtime config included) survive a
            # reset, since reset --hard only ever touches tracked files.
            git reset --hard FETCH_HEAD

            pnpm install --frozen-lockfile
            pnpm --filter @fenwick/shared build

            # Reads DIRECT_DATABASE_URL from this box's own .env, same as a
            # manual run — no DB credential is duplicated into GitHub secrets.
            pnpm --filter @fenwick/api db:migrate

            pnpm --filter @fenwick/api build
            pnpm --filter @fenwick/admin build
            pnpm --filter @fenwick/payment build

            pm2 reload ecosystem.config.cjs --update-env
            pm2 save
